<html>
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Practise Form</title>
  </head>
  <body style="font-family: Montserrat, sans-serif">
    <h1>Let us know how we can improve freeCodeCamp</h1>

    <input type="text" placeholder="Enter your name" />
    <br />
    <br />
    <input type="email" id="email" placeholder="Enter your Email" />
    <br />
    <br />
    <input type="number" placeholder="Age" />
    <br />
    <br />
    <!-- <input type="" placeholder="Student" /> -->
    <select>
      <option value="Spiderman">Spiderman</option>
      <option value="Goku">Goku</option>
    </select>
    <br />
    <br />
    <label for="saif">
      <input type="radio" id="saif" value="Definitely" />
      Saif
    </label>

    <label for="adnan">
      <input type="radio" id="adnan" value="Maybe" />
      Adnan
    </label>

    <label for="Bob">
      <input type="radio" id="Bob" value="Maybe" />
      Bob
    </label>
    <br />
    <br />
    <select>
      <option value="Select an Option">Select an Option</option>
      <option value="Food">Food</option>
      <option value="Code">Code</option>
    </select>
  </body>
</html>
